name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Hannibal has no third-party dependencies — stdlib only.
      - name: Run safety test suite
        run: python -m unittest discover -s tests -v

      - name: Injection red-team (regex stage, no model)
        run: python redteam.py

      - name: Benchmark the orchestration pipeline (dry-run)
        run: python benchmark.py

      - name: Smoke-test a full run + HTML report
        run: |
          python hannibal.py run -o "ci smoke test" -s 10.10.10.5,10.10.10.0/24
          python hannibal.py verify-audit hannibal_run
          python hannibal.py report hannibal_run --html
